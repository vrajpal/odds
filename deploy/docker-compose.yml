# ScaleTail-style Tailscale sidecar deployment (github.com/tailscale-dev/ScaleTail).
#
# The app joins the tailnet as its OWN node ("odds") — nothing is tied to the
# host machine, no host ports are published at all. The APIs bind loopback
# inside the shared network namespace, so the ONLY way in is Tailscale Serve's
# HTTPS front door:
#
#   https://odds.<tailnet>.ts.net       — contest API (enter Circa lines at /docs)
#   https://odds.<tailnet>.ts.net:8443  — MLB odds API + web UI
#
# Setup: cp .env.example .env, fill TS_AUTHKEY + THE_ODDS_API_KEY, then
#   docker compose up -d --build
# One-shot NFL collection (cron Thu-Sat ~3x/day; 3 credits/run):
#   docker compose run --rm nfl-collect

name: odds # explicit project name; the directory-derived default ("deploy") is collision-prone

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: odds # tailnet node name → odds.<tailnet>.ts.net
    environment:
      # Unset is fine: the sidecar then prints an interactive login URL to its
      # logs (`docker compose logs tailscale`) — approve once, state persists.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 12

  contest-api:
    build: ..
    command: uvicorn mlb_odds.contest_api:app --host 127.0.0.1 --port 8001
    environment:
      # Ordered: position defines the weekly captain rotation.
      CONTEST_MEMBERS: ${CONTEST_MEMBERS:-player1,player2,player3}
      # Access email -> member identity map (D-026). Interpolated from .env —
      # a variable in .env reaches the container ONLY via this declaration.
      CONTEST_MEMBER_EMAILS: ${CONTEST_MEMBER_EMAILS:-}
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped

  odds-api:
    build: ..
    command: uvicorn mlb_odds.api:app --host 127.0.0.1 --port 8000
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped

  nfl-collect:
    build: ..
    profiles: [collect]
    # Curated 10-book list = same 3-credit cost as the us region, but with
    # pinnacle (the sharp reference) included (D-027).
    command: >
      mlb-odds collect --once --sport nfl
      --bookmaker pinnacle --bookmaker draftkings --bookmaker fanduel
      --bookmaker betmgm --bookmaker williamhill_us --bookmaker betrivers
      --bookmaker betonlineag --bookmaker lowvig --bookmaker bovada
      --bookmaker mybookieag
    environment:
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:?needed for metered NFL collection}
    volumes:
      - ./data:/data

  nfl-results:
    build: ..
    profiles: [collect]
    command: mlb-odds results --sport nfl # ESPN scoreboard: free, no key
    volumes:
      - ./data:/data

  mlb-collect:
    build: ..
    profiles: [collect]
    # Free ESPN provider (one book): keeps the baseball Today board alive
    # without touching the metered credit budget.
    command: mlb-odds collect --once --sport mlb --provider espn
    volumes:
      - ./data:/data

  statcast:
    build: ..
    profiles: [collect]
    # Free scouting pull (D-031): schedule, probables, Savant expected stats.
    command: mlb-odds statcast
    volumes:
      - ./data:/data

  # Public access for non-tailnet friends (D-026): Cloudflare Tunnel with a
  # Cloudflare Access policy in front (email OTP allowlist). Outbound-only —
  # still no published ports anywhere. Opt-in AFTER the Access policy exists:
  #   docker compose --profile public up -d
  # Locally-managed tunnel: ./cloudflared/ holds config.yml + the tunnel
  # credentials json (gitignored; created via `cloudflared tunnel create`).
  # Shares the tailscale sidecar's namespace so localhost IS the contest API.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tailscale-state:
